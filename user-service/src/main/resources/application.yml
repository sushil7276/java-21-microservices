server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: classpath:common-defaults.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/user_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}

app:
  jwt:
    expiration-seconds: 3600
