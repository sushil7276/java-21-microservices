# Shared defaults imported by every business service (spring.config.import: classpath:common-defaults.yml)
spring:
  cloud:
    circuitbreaker:
      resilience4j:
        # Run the protected call on the SAME thread (no thread-pool / time-limiter hop).
        # Reason: the tracing context (traceId) lives in the calling thread. Time-outs are done by the
        # RestClient itself (2 s connect, 5 s read - see LoadBalancedClientConfig).
        disable-thread-pool: true
        disable-time-limiter: true
    loadbalancer:
      cache:
        ttl: 5s            # default 35 s: after a restart, calls kept going to the old (dead) address for that long
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5      # default 30: how often a service refreshes its list of other services
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5    # default 30: heartbeat
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  file:
    name: ${LOG_DIR:../logs}/${spring.application.name}.log
  structured:
    format:
      file: logstash        # JSON log file, picked up by Logstash -> Elasticsearch -> Kibana

app:
  jwt:
    secret: ${JWT_SECRET:ecommerce-microservices-demo-secret-key-change-me-please-32b}

