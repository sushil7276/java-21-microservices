# Shared defaults imported by every business service (spring.config.import: classpath:common-defaults.yml)
spring:
  cloud:
    circuitbreaker:
      resilience4j:
        # Run the protected call on the SAME thread (no thread-pool / time-limiter hop).
        # Reason: the tracing context (traceId) lives in the calling thread. Time-outs are done by the
        # RestClient itself (2 s connect, 5 s read - see LoadBalancedClientConfig).
        disable-thread-pool: true
        disable-time-limiter: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  file:
    name: ${LOG_DIR:../logs}/${spring.application.name}.log
  structured:
    format:
      file: logstash        # JSON log file, picked up by Logstash -> Elasticsearch -> Kibana

app:
  jwt:
    secret: ${JWT_SECRET:ecommerce-microservices-demo-secret-key-change-me-please-32b}

