# Runs every microservice as a container next to the infrastructure of docker-compose.yml:
#   ./scripts/build.sh
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build
# (stop the locally started services first - they use the same ports)
name: ecommerce

x-app-env: &app-env
  EUREKA_URL: http://discovery-server:8761/eureka
  ZIPKIN_URL: http://zipkin:9411/api/v2/spans
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  KAFKA_BOOTSTRAP: kafka:29092
  MONGO_URI: mongodb://mongodb:27017/audit_db
  LOG_DIR: /logs

x-infra-ready: &infra-ready
  mysql: { condition: service_healthy }
  mongodb: { condition: service_healthy }
  kafka: { condition: service_healthy }

services:
  discovery-server:
    build:
      context: .
      args:
        MODULE: discovery-server
    image: ecommerce/discovery-server:1.0.0
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      <<: *app-env
      EUREKA_HOST: discovery-server
    depends_on:
      <<: *infra-ready
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    volumes:
      - ./logs:/logs
  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    image: ecommerce/api-gateway:1.0.0
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      EUREKA_HOST: discovery-server
    depends_on:
      <<: *infra-ready
      discovery-server: { condition: service_healthy }
    volumes:
      - ./logs:/logs
  user-service:
    build:
      context: .
      args:
        MODULE: user-service
    image: ecommerce/user-service:1.0.0
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      <<: *app-env
      EUREKA_HOST: discovery-server
    depends_on:
      <<: *infra-ready
      discovery-server: { condition: service_healthy }
    volumes:
      - ./logs:/logs
  product-service:
    build:
      context: .
      args:
        MODULE: product-service
    image: ecommerce/product-service:1.0.0
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      <<: *app-env
      EUREKA_HOST: discovery-server
    depends_on:
      <<: *infra-ready
      discovery-server: { condition: service_healthy }
    volumes:
      - ./logs:/logs
  cart-service:
    build:
      context: .
      args:
        MODULE: cart-service
    image: ecommerce/cart-service:1.0.0
    container_name: cart-service
    ports:
      - "8083:8083"
    environment:
      <<: *app-env
      EUREKA_HOST: discovery-server
    depends_on:
      <<: *infra-ready
      discovery-server: { condition: service_healthy }
    volumes:
      - ./logs:/logs
  order-service:
    build:
      context: .
      args:
        MODULE: order-service
    image: ecommerce/order-service:1.0.0
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      <<: *app-env
      EUREKA_HOST: discovery-server
    depends_on:
      <<: *infra-ready
      discovery-server: { condition: service_healthy }
    volumes:
      - ./logs:/logs
  payment-service:
    build:
      context: .
      args:
        MODULE: payment-service
    image: ecommerce/payment-service:1.0.0
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      <<: *app-env
      EUREKA_HOST: discovery-server
    depends_on:
      <<: *infra-ready
      discovery-server: { condition: service_healthy }
    volumes:
      - ./logs:/logs
  shipping-service:
    build:
      context: .
      args:
        MODULE: shipping-service
    image: ecommerce/shipping-service:1.0.0
    container_name: shipping-service
    ports:
      - "8086:8086"
    environment:
      <<: *app-env
      EUREKA_HOST: discovery-server
    depends_on:
      <<: *infra-ready
      discovery-server: { condition: service_healthy }
    volumes:
      - ./logs:/logs
  favourite-service:
    build:
      context: .
      args:
        MODULE: favourite-service
    image: ecommerce/favourite-service:1.0.0
    container_name: favourite-service
    ports:
      - "8087:8087"
    environment:
      <<: *app-env
      EUREKA_HOST: discovery-server
    depends_on:
      <<: *infra-ready
      discovery-server: { condition: service_healthy }
    volumes:
      - ./logs:/logs
  audit-service:
    build:
      context: .
      args:
        MODULE: audit-service
    image: ecommerce/audit-service:1.0.0
    container_name: audit-service
    ports:
      - "8088:8088"
    environment:
      <<: *app-env
      EUREKA_HOST: discovery-server
    depends_on:
      <<: *infra-ready
      discovery-server: { condition: service_healthy }
    volumes:
      - ./logs:/logs

  prometheus:
    volumes:
      - ./docker/prometheus/prometheus-containers.yml:/etc/prometheus/prometheus.yml:ro
