# MySQL, MongoDB, Kafka and Zipkin inside the cluster (single replica, demo grade)
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mysql-pvc, namespace: ecommerce }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mysql, namespace: ecommerce }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      enableServiceLinks: false
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: ecommerce-secret, key: MYSQL_PASSWORD } } }
          ports: [{ containerPort: 3306 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"] }
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: mysql, namespace: ecommerce }
spec:
  selector: { app: mysql }
  ports: [{ port: 3306 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mongodb-pvc, namespace: ecommerce }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongodb, namespace: ecommerce }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb } }
    spec:
      enableServiceLinks: false
      containers:
        - name: mongodb
          image: mongo:8.0
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mongodb-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: mongodb, namespace: ecommerce }
spec:
  selector: { app: mongodb }
  ports: [{ port: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, namespace: ecommerce }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      enableServiceLinks: false          # otherwise k8s injects KAFKA_PORT=tcp://... and breaks the broker
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: ecommerce }
spec:
  selector: { app: kafka }
  ports: [{ port: 9092 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: zipkin, namespace: ecommerce }
spec:
  replicas: 1
  selector: { matchLabels: { app: zipkin } }
  template:
    metadata: { labels: { app: zipkin } }
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3
          ports: [{ containerPort: 9411 }]
---
apiVersion: v1
kind: Service
metadata: { name: zipkin, namespace: ecommerce }
spec:
  type: NodePort
  selector: { app: zipkin }
  ports: [{ port: 9411, nodePort: 30411 }]
