apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  EUREKA_URL: http://discovery-server:8761/eureka
  ZIPKIN_URL: http://zipkin:9411/api/v2/spans
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  KAFKA_BOOTSTRAP: kafka:9092
  MONGO_URI: mongodb://mongodb:27017/audit_db
---
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  namespace: ecommerce
type: Opaque
stringData:                       # demo values - replace (or use a real secret manager) outside of a laptop
  MYSQL_USER: root
  MYSQL_PASSWORD: "123456"
  JWT_SECRET: ecommerce-microservices-demo-secret-key-change-me-please-32b
