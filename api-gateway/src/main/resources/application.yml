server:
  port: 8080

spring:
  application:
    name: api-gateway
  reactor:
    context-propagation: auto
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cloud:
    loadbalancer:
      cache:
        ttl: 5s            # default 35 s
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          # REDIS RATE LIMITING: every route below has a "RequestRateLimiter" filter. Redis counts the requests of each caller
          #   replenishRate = how many requests per second a caller may do on average
          #   burstCapacity = how many requests it may do at once (a short burst)
          # Too many requests -> the gateway answers HTTP 429 and does not even call the service.
          # (The key resolvers, i.e. WHO is counted, are in RateLimitConfig.java)
          routes:
            # login + register: counted per IP address and much stricter, so passwords cannot be guessed quickly
            - id: auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 10
                - CircuitBreaker=user-service-breaker,forward:/fallback/user-service
            # everything else: counted per logged-in user (or per IP address for guests)
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - CircuitBreaker=user-service-breaker,forward:/fallback/user-service
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - CircuitBreaker=product-service-breaker,forward:/fallback/product-service
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/cart/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - CircuitBreaker=cart-service-breaker,forward:/fallback/cart-service
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - CircuitBreaker=order-service-breaker,forward:/fallback/order-service
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - CircuitBreaker=payment-service-breaker,forward:/fallback/payment-service
            - id: shipping-service
              uri: lb://shipping-service
              predicates:
                - Path=/api/shipments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - CircuitBreaker=shipping-service-breaker,forward:/fallback/shipping-service
            - id: favourite-service
              uri: lb://favourite-service
              predicates:
                - Path=/api/favourites/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - CircuitBreaker=favourite-service-breaker,forward:/fallback/favourite-service
            - id: audit-service
              uri: lb://audit-service
              predicates:
                - Path=/api/audit/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - CircuitBreaker=audit-service-breaker,forward:/fallback/audit-service
            - id: batch-service
              uri: lb://batch-service
              predicates:
                - Path=/api/batch/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - CircuitBreaker=batch-service-breaker,forward:/fallback/batch-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5      # default 30: a restarted service becomes routable in ~5 s instead of ~30-60 s
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:ecommerce-microservices-demo-secret-key-change-me-please-32b}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  file:
    name: ${LOG_DIR:../logs}/${spring.application.name}.log
  structured:
    format:
      file: logstash
