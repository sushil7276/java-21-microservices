# Scrapes the services running on the host machine (macOS/Windows Docker Desktop: host.docker.internal)
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: ecommerce
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8761']
        labels: { application: discovery-server }
      - targets: ['host.docker.internal:8080']
        labels: { application: api-gateway }
      - targets: ['host.docker.internal:8081']
        labels: { application: user-service }
      - targets: ['host.docker.internal:8082']
        labels: { application: product-service }
      - targets: ['host.docker.internal:8083']
        labels: { application: cart-service }
      - targets: ['host.docker.internal:8084']
        labels: { application: order-service }
      - targets: ['host.docker.internal:8085']
        labels: { application: payment-service }
      - targets: ['host.docker.internal:8086']
        labels: { application: shipping-service }
      - targets: ['host.docker.internal:8087']
        labels: { application: favourite-service }
      - targets: ['host.docker.internal:8088']
        labels: { application: audit-service }
