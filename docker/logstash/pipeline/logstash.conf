# Spring Boot writes JSON (logstash format) log files into ./logs ; ship them to Elasticsearch.
input {
  file {
    path => "/logs/*.log"
    codec => "json"
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/tmp/sincedb"
    stat_interval => 1
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ecommerce-logs-%{+YYYY.MM.dd}"
  }
}
